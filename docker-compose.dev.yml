# Local development override. Run with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build web

services:
  db:
    ports: !override
      - '127.0.0.1:5432:5432'

  redis:
    ports:
      - '127.0.0.1:6379:6379'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: 'no'
    ports: !override
      - '127.0.0.1:3000:3000'
    command: ['npm', 'run', 'dev', '--', '--hostname', '0.0.0.0', '--webpack']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-personal_system}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ps_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      KNOWLEDGE_UPLOAD_DIR: /app/data/knowledge
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
      - ./data/knowledge:/app/data/knowledge

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

volumes:
  dev_node_modules:
  dev_next:
